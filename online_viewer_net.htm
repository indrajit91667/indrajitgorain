* { box-sizing: border-box; }

body{
    margin:0;
    font-family:Arial;
    background:#000066;  
    display:flex;
    justify-content:center;
}

/* SPLASH FULL SCREEN */
#splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh; /* 👈 mobile full height */
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.5s ease;
}

/* 9:16 RESPONSIVE BOX */
.splash-box{
    width:100%;
    height:100%;
    max-width:100vh * 9 / 16; /* auto adjust */
    aspect-ratio:9/16;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* IMAGE FIT */
.splash-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* APP */
.app{
    width:100%;
    max-width:900px;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    width:100%;
    max-width:900px;
    height:45px;
    background:#000066;
    display:flex;
    align-items:center;
    padding-left:10px;
    border-bottom:0px solid #ddd;
    z-index:1000;
}

header img{
    height:100%;
}

/* MAIN */
.main{
    margin-top:45px;
    padding-bottom:60px; /* bottom menu space */
}

/* TOP */
#topBox{
    position:sticky;
    top:45px;
    background:black;
}

/* MEDIA */
.media-box{
    width:100%;
    aspect-ratio:16/9;
    position:relative;
    overflow:hidden;
}

/* SLIDER */
.slider-track{
    display:flex;
    height:100%;
    transition:transform 0.7s ease-in-out;
}

.slide{
    min-width:100%;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* PLAYER */
.media-box iframe{
    width:100%;
    height:100%;
}

/* CLOSE */
.close-btn{
    position:absolute;
    top:10px;
    left:10px;
    background:blue;
    color:red;
    border:none;
    z-index:10;
}

/* CARDS */
.channels{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    padding:10px;
}

.card{
    text-align:center;
    cursor:pointer;
        color:white;
}

.card img{

    height:60px;
    border-radius:50%;
    border:3px solid red;
    padding:2px;

.card-title{
    font-size:11px;
}
/* MOBILE */

<script>

/* SLIDER */
let index=0;

setInterval(()=>{
    const track=document.getElementById("sliderTrack"); 
    const slides=document.querySelectorAll(".slide"); 

    index++;
    if(index>=slides.length) index=0;

    track.style.transform=`translateX(-${index*100}%)`;
},3000);

/* PLAY */
function playChannel(url){
    document.getElementById("player").src=url;
    document.getElementById("banner").style.display="none";
    document.getElementById("playerBox").style.display="block";
}

/* CLOSE */
function closeVideo(){
    document.getElementById("playerBox").style.display="none";
    document.getElementById("banner").style.display="block";
    document.getElementById("player").src="";
}

/* SPLASH HIDE AFTER 5 SEC */
window.onload = function(){
    setTimeout(function(){
        let splash = document.getElementById("splash");
        splash.style.opacity = "0";

        setTimeout(function(){
            splash.style.display = "none";
        }, 500);

    }, 5000);
};

</script>
